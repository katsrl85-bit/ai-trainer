name: AI тренер

on:
  schedule:
    - cron: "*/10 * * * *"   # примерно раз в 10 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

concurrency:
  group: ai-trainer
  cancel-in-progress: false

permissions:
  contents: write             # только для ежемесячного «keepalive»-коммита

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Восстановить состояние бота
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Запуск бота
        run: python bot.py
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REPORT_FORMAT: ${{ vars.REPORT_FORMAT }}
          AUTO_ANALYZE: ${{ vars.AUTO_ANALYZE }}

      - name: Сохранить состояние бота
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}

      - name: Keepalive (GitHub отключает расписание после 60 дней без коммитов)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 4320000 ]; then
            git config user.name "ai-trainer-bot"
            git config user.email "ai-trainer-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
